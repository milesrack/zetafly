name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    # MongoDB 8.0 requires a kernel below 6.19 (SERVER-121912).
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      COMPOSE_FILE: compose.yaml:compose.ci.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check shell syntax
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - run: node scripts/setup-env.ts
      - run: docker compose -f compose.yaml -f compose.production.yaml config --quiet
        env:
          ZETAFLY_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
      - run: npm run model:fetch
      - run: npm run check
      - run: npm run test:simulator
      - run: docker compose up --build -d --wait
      - name: Browser, database, and model runtime
        run: docker compose exec -T -w /app/server app node --input-type=module-typescript < scripts/verify-runtime.ts
      - run: npm run test:integration
      - name: Container diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100
      - if: always()
        run: docker compose down
  ui:
    name: ui (${{ matrix.check }})
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [sound, auth-ui, playback, mobile]
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --workspace web
      - name: Browser checks
        env:
          DEBUG: pw:api,pw:browser
        run: bash scripts/check-ui.sh ${{ matrix.check }}
      - name: Server diagnostics
        if: failure()
        run: cat /tmp/zetafly-ui.log
  publish:
    needs: [checks, ui]
    if: github.event_name == 'push' && github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare image name
        id: image
        run: printf 'repository=ghcr.io/%s/app\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: app
          push: true
          tags: ${{ steps.image.outputs.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
