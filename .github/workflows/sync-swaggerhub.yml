name: Update Swagger Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - openapi.yaml

permissions:
  contents: read

concurrency:
  group: swagger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Update Swagger
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update Swagger API
        env:
          SWAGGERHUB_OWNER: ${{ vars.SWAGGERHUB_OWNER }}
          SWAGGERHUB_API_KEY: ${{ secrets.SWAGGERHUB_API_KEY }}
        run: |
          curl --fail-with-body --silent --show-error \
            --url "https://api.swaggerhub.com/apis/${SWAGGERHUB_OWNER}/zetafly" \
            --header "Authorization: ${SWAGGERHUB_API_KEY}" \
            --header "Content-Type: application/yaml" \
            --data-binary "@openapi.yaml"
