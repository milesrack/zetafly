services:
  mongo:
    logging: &production-logging
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 384m
    memswap_limit: 768m
    command: [mongod, --wiredTigerCacheSizeGB, "0.25"]
    restart: unless-stopped
    networks: [database]
  mailpit:
    profiles: [development]
  app:
    logging: *production-logging
    mem_limit: 768m
    memswap_limit: 1536m
    image: ${ZETAFLY_IMAGE:?Set ZETAFLY_IMAGE}
    build: !reset null
    restart: unless-stopped
    depends_on: !override
      mongo:
        condition: service_healthy
    environment:
      PUBLIC_DEPLOYMENT: "true"
    networks: [default, database]
networks:
  database:
    internal: true
