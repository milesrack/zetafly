<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
  </head>
  <body
    style="
      margin: 0;
      background: #fff;
      color: #20242c;
      font-family: Arial, sans-serif;
    "
  >
    <table
      role="presentation"
      style="width: 100%; border: 0; border-spacing: 0"
    >
      <tr>
        <td style="padding: 48px 24px">
          <table
            role="presentation"
            style="
              width: 100%;
              max-width: 440px;
              margin: auto;
              border: 0;
              border-spacing: 0;
            "
          >
            <tr>
              <td>
                <p style="margin: 0 0 32px; font-size: 16px; font-weight: 600">
                  zetafly
                </p>
                <h1 style="margin: 0 0 16px; font-size: 24px; line-height: 1.3">
                  {{title}}
                </h1>
                <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.6">
                  {{instruction}}
                </p>
                {{details}}
                <table role="presentation" style="border: 0; border-spacing: 0">
                  <tr>
                    <td style="background: #20242c; border-radius: 6px">
                      <a
                        href="{{escaped}}"
                        style="
                          display: inline-block;
                          padding: 13px 22px;
                          color: #fff;
                          text-decoration: none;
                          font-size: 14px;
                          font-weight: 600;
                        "
                        >{{action}}</a
                      >
                    </td>
                  </tr>
                </table>
                <p style="margin: 20px 0 0; font-size: 15px; line-height: 1.6">
                  Or copy this link into your browser:<br /><a
                    href="{{escaped}}"
                    style="color: #20242c; word-break: break-all"
                    >{{escaped}}</a
                  >
                </p>
                <p
                  style="
                    margin: 24px 0;
                    font-size: 13px;
                    line-height: 1.6;
                    color: #69717d;
                  "
                >
                  Zetafly production operations.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
